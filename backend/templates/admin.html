{% extends "base.html" %}

{% block title %}BestQuest — админка{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
<main id="admin-root">
  <section id="admin-auth-screen" class="auth-screen fade-swap" hidden>
    <div class="auth-brand">
      <img class="auth-brand__mark" src="{{ url_for('static', filename='img/logo.png') }}" alt="BestQuest">
      <div class="auth-brand__title">BestQuest — админка</div>
      <div class="auth-brand__subtitle">Войдите как оператор или актёр</div>
    </div>

    <div class="auth-card">
      <form id="admin-auth-form" class="auth-form" autocomplete="off">
        <div class="field">
          <label for="admin-username">Логин</label>
          <input type="text" id="admin-username" name="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="admin-password">Пароль</label>
          <input type="password" id="admin-password" name="password" required autocomplete="current-password">
        </div>
        <p class="form-error" id="admin-auth-error" role="alert"></p>
        <button type="submit" class="btn-primary" id="admin-auth-submit">Войти</button>
      </form>
    </div>
  </section>

  <section id="admin-app-screen" class="app-screen fade-swap" hidden>
    <div id="admin-banner-container" class="toast-container" aria-live="assertive"></div>

    <header class="app-header">
      <span class="app-header__team" id="admin-header-name"></span>
      <button type="button" class="app-header__logout" id="admin-logout-button" aria-label="Выйти">
        <img src="{{ url_for('static', filename='img/logout.png') }}" alt="" class="app-header__logout-icon">
      </button>
    </header>

    <main class="app-content">
      <section id="admin-panel-teams" class="panel">
        <div id="admin-teams-list-view">
          <div id="admin-team-list" class="team-list"></div>
          <p id="admin-team-list-empty" class="empty-state" hidden></p>
        </div>

        <div id="admin-team-detail-view" hidden>
          <div class="chat-detail__header">
            <button type="button" id="admin-team-back-button" class="chat-detail__back" aria-label="Назад">&#8592;</button>
            <span id="admin-team-detail-title" class="chat-detail__title"></span>
          </div>

          <div id="admin-team-tasks-list-view">
            <div class="segmented" role="tablist">
              <button type="button" class="segmented__btn" id="admin-tasks-view-available" role="tab" aria-selected="true">Актуальные</button>
              <button type="button" class="segmented__btn" id="admin-tasks-view-completed" role="tab" aria-selected="false">Выполненные</button>
            </div>
            <div id="admin-task-list" class="task-list"></div>
            <p id="admin-task-empty" class="empty-state" hidden></p>
            <button type="button" id="admin-graph-open-button" class="btn-secondary admin-graph-open-button">Показать как граф</button>
          </div>

          <div id="admin-team-graph-view" hidden>
            <button type="button" id="admin-graph-back-button" class="btn-secondary admin-graph-back-button">&#8592; К списку</button>
            <div id="admin-team-graph-empty" class="empty-state" hidden></div>
            <div id="admin-team-graph-scroll" class="admin-graph-scroll">
              <svg id="admin-team-graph" class="admin-graph"></svg>
            </div>
          </div>
        </div>
      </section>

      <section id="admin-panel-support" class="panel" hidden>
        <div id="admin-support-list-view">
          <div id="admin-support-chat-list" class="chat-list"></div>
          <p id="admin-support-list-empty" class="empty-state" hidden></p>
        </div>

        <div id="admin-support-chat-detail-view" class="chat-detail" hidden>
          <div class="chat-detail__header">
            <button type="button" id="admin-support-chat-back-button" class="chat-detail__back" aria-label="Назад">&#8592;</button>
            <span id="admin-support-chat-detail-title" class="chat-detail__title"></span>
          </div>

          <div class="field admin-chat-mode-field">
            <label for="admin-support-chat-mode-select">Режим чата</label>
            <select id="admin-support-chat-mode-select" class="admin-chat-mode-select">
              <option value="scripted">Сценарий</option>
              <option value="operator">Оператор</option>
              <option value="gpt">GPT</option>
              <option value="muted">Тихо</option>
            </select>
          </div>
          <p class="form-error" id="admin-support-chat-mode-error"></p>

          <div id="admin-support-chat-messages" class="chat-messages"></div>
          <div id="admin-support-chat-input-row" class="chat-input-row" hidden>
            <input type="text" id="admin-support-chat-input" class="chat-input" placeholder="Сообщение…" autocomplete="off">
            <button type="button" id="admin-support-chat-send-button" class="chat-send-button" aria-label="Отправить">&#10148;</button>
          </div>
        </div>
      </section>

      <section id="admin-panel-dialogues" class="panel" hidden>
        <div id="admin-dialogues-list-view">
          <div class="field admin-persona-field">
            <label for="admin-persona-select">Персонаж</label>
            <select id="admin-persona-select" class="admin-chat-mode-select"></select>
          </div>
          <div id="admin-persona-chat-list" class="chat-list"></div>
          <p id="admin-persona-list-empty" class="empty-state" hidden></p>
        </div>

        <div id="admin-dialogues-chat-detail-view" class="chat-detail" hidden>
          <div class="chat-detail__header">
            <button type="button" id="admin-dialogues-chat-back-button" class="chat-detail__back" aria-label="Назад">&#8592;</button>
            <span id="admin-dialogues-chat-detail-title" class="chat-detail__title"></span>
          </div>

          <div class="field admin-chat-mode-field">
            <label for="admin-dialogues-chat-mode-select">Режим чата</label>
            <select id="admin-dialogues-chat-mode-select" class="admin-chat-mode-select">
              <option value="scripted">Сценарий</option>
              <option value="operator">Оператор</option>
              <option value="gpt">GPT</option>
              <option value="muted">Тихо</option>
            </select>
          </div>
          <p class="form-error" id="admin-dialogues-chat-mode-error"></p>

          <div id="admin-dialogues-chat-messages" class="chat-messages"></div>
          <div id="admin-dialogues-chat-input-row" class="chat-input-row" hidden>
            <input type="text" id="admin-dialogues-chat-input" class="chat-input" placeholder="Сообщение…" autocomplete="off">
            <button type="button" id="admin-dialogues-chat-send-button" class="chat-send-button" aria-label="Отправить">&#10148;</button>
          </div>
        </div>
      </section>

      <section id="admin-panel-reviews" class="panel" hidden>
        <div id="admin-review-list" class="review-list"></div>
        <p id="admin-review-list-empty" class="empty-state" hidden></p>
      </section>

      <section id="admin-panel-approvals" class="panel" hidden>
        <div id="admin-approval-list" class="approval-list"></div>
        <p id="admin-approval-list-empty" class="empty-state" hidden></p>
      </section>
    </main>

    <nav class="bottom-nav">
      <button type="button" class="bottom-nav__btn" id="admin-tab-teams" aria-selected="true">
        <span class="bottom-nav__icon" aria-hidden="true">&#128101;</span>
        <span>Команды</span>
      </button>
      <button type="button" class="bottom-nav__btn" id="admin-tab-support" aria-selected="false" hidden>
        <span class="bottom-nav__icon-wrap">
          <span class="bottom-nav__icon" aria-hidden="true">&#127908;</span>
          <span class="bottom-nav__dot" id="admin-tab-support-dot" hidden></span>
        </span>
        <span>Техподдержка</span>
      </button>
      <button type="button" class="bottom-nav__btn" id="admin-tab-dialogues" aria-selected="false" hidden>
        <span class="bottom-nav__icon-wrap">
          <span class="bottom-nav__icon" aria-hidden="true">&#128172;</span>
          <span class="bottom-nav__dot" id="admin-tab-dialogues-dot" hidden></span>
        </span>
        <span>Диалоги</span>
      </button>
      <button type="button" class="bottom-nav__btn" id="admin-tab-reviews" aria-selected="false">
        <span class="bottom-nav__icon-wrap">
          <span class="bottom-nav__icon" aria-hidden="true">&#128203;</span>
          <span class="bottom-nav__dot" id="admin-tab-reviews-dot" hidden></span>
        </span>
        <span>Проверка</span>
      </button>
      <button type="button" class="bottom-nav__btn" id="admin-tab-approvals" aria-selected="false" hidden>
        <span class="bottom-nav__icon-wrap">
          <span class="bottom-nav__icon" aria-hidden="true">&#9989;</span>
          <span class="bottom-nav__dot" id="admin-tab-approvals-dot" hidden></span>
        </span>
        <span>Блок-посты</span>
      </button>
    </nav>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin-auth.js') }}"></script>
{% endblock %}
