{% extends "base.html" %}

{% block title %}BestQuest — вход{% endblock %}

{% block content %}
<main id="root">
  <section id="auth-screen" class="auth-screen fade-swap" hidden>
    <div class="auth-brand">
      <img class="auth-brand__mark" src="{{ url_for('static', filename='img/logo.png') }}" alt="BestQuest">
      <div class="auth-brand__title">BestQuest</div>
      <div class="auth-brand__subtitle">Войдите в аккаунт команды, чтобы продолжить</div>
    </div>

    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab" id="tab-login" role="tab" aria-selected="true">Вход</button>
        <button type="button" class="auth-tab" id="tab-register" role="tab" aria-selected="false">Новая команда</button>
      </div>

      <form id="auth-form" class="auth-form" autocomplete="off">
        <div class="field">
          <label for="team-name">Название команды</label>
          <input type="text" id="team-name" name="name" required autocomplete="username">
        </div>
        <div class="field">
          <label for="team-password">Пароль</label>
          <input type="password" id="team-password" name="password" required autocomplete="current-password">
        </div>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button type="submit" class="btn-primary" id="auth-submit">Войти</button>
      </form>
    </div>
  </section>

  <section id="app-screen" class="app-screen fade-swap" hidden>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <header class="app-header">
      <span class="app-header__team" id="app-team-name"></span>
      <button type="button" class="app-header__logout" id="logout-button" aria-label="Выйти">
        <img src="{{ url_for('static', filename='img/logout.png') }}" alt="" class="app-header__logout-icon">
      </button>
    </header>

    <main class="app-content">
      <section id="panel-tasks" class="panel">
        <p id="task-chapter" class="task-chapter" hidden></p>
        <div class="segmented" role="tablist">
          <button type="button" class="segmented__btn" id="tasks-view-available" role="tab" aria-selected="true">Актуальные</button>
          <button type="button" class="segmented__btn" id="tasks-view-completed" role="tab" aria-selected="false">Выполненные</button>
        </div>
        <div id="task-list" class="task-list"></div>
        <p id="task-empty" class="empty-state" hidden></p>
      </section>

      <section id="panel-chat" class="panel" hidden>
        <div id="chat-list-view">
          <div class="chat-search-row">
            <input type="text" id="chat-search-input" class="chat-search-input" placeholder="#ник персонажа" autocomplete="off">
            <button type="button" id="chat-search-button" class="btn-secondary chat-search-button">Найти</button>
          </div>
          <p class="form-error" id="chat-search-error"></p>
          <div id="chat-list" class="chat-list"></div>
          <p id="chat-list-empty" class="empty-state" hidden></p>
        </div>

        <div id="chat-detail-view" class="chat-detail" hidden>
          <div class="chat-detail__header">
            <button type="button" id="chat-back-button" class="chat-detail__back" aria-label="Назад">&#8592;</button>
            <span id="chat-detail-title" class="chat-detail__title"></span>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <div id="chat-input-row" class="chat-input-row" hidden>
            <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение…" autocomplete="off">
            <button type="button" id="chat-send-button" class="chat-send-button" aria-label="Отправить">&#10148;</button>
          </div>
          <div id="chat-options" class="chat-options" hidden></div>
          <p id="chat-readonly-note" class="empty-state" hidden></p>
        </div>
      </section>

      <section id="panel-calls" class="panel" hidden>
        <div id="dialer-view" class="dialer">
          <div class="dialer-display" id="dialer-display"></div>
          <div class="keypad" id="dialer-keypad"></div>
          <div class="dialer-actions">
            <button type="button" id="dialer-backspace" class="btn-secondary dialer-actions__backspace">&#9003;</button>
            <button type="button" id="dialer-call" class="dialer-actions__call" aria-label="Позвонить">&#128222;</button>
          </div>
        </div>

        <div id="call-view" class="call-view" hidden>
          <p class="call-view__status" id="call-status"></p>
          <div class="call-voice-bars" id="call-voice-bars" hidden aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="call-view__audio" id="call-audio"></div>

          <div id="call-password-section" class="call-password" hidden>
            <input type="text" class="dialer-display password-input" id="password-display" placeholder="Ввод..." autocomplete="off">
            <div class="keypad" id="password-keypad"></div>
            <div class="password-actions">
              <button type="button" id="call-end" class="password-actions__btn password-actions__end" aria-label="Сбросить">&#128222;</button>
              <button type="button" id="password-submit" class="password-actions__btn password-actions__submit" aria-label="Ввести">&#9166;</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button type="button" class="bottom-nav__btn" id="tab-tasks" aria-selected="true">
        <span class="bottom-nav__icon" aria-hidden="true">&#9989;</span>
        <span>Задачи</span>
      </button>
      <button type="button" class="bottom-nav__btn" id="tab-chat" aria-selected="false">
        <span class="bottom-nav__icon-wrap">
          <span class="bottom-nav__icon" aria-hidden="true">&#128172;</span>
          <span class="bottom-nav__dot" id="tab-chat-dot" hidden></span>
        </span>
        <span>Чат</span>
      </button>
      <button type="button" class="bottom-nav__btn" id="tab-calls" aria-selected="false">
        <span class="bottom-nav__icon" aria-hidden="true">&#128222;</span>
        <span>Звонки</span>
      </button>
    </nav>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
