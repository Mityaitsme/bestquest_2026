# Игровой контент: персонажи + граф этапов + поля ответа.
#
# Персонажи (characters):
#   slug        — уникальный id (не менять после публикации)
#   name        — как зовут персонажа "по паспорту"
#   nickname    — ник, по которому команда ищет его в поиске чатов (можно
#                 вводить с "#" или без — это просто визуальная подсказка)
#   public_lore — необязательно, публичная предыстория персонажа
# При регистрации команды под каждого персонажа создаётся чат (плюс один
# чат техподдержки), но команда его пока НЕ видит в списке — см. ниже
# triggers_scripted_dialogue и backend/chat.py: seed_team_chats/discover_chat.
# Режим чата по умолчанию — 'muted' у персонажей со сценарным диалогом (см.
# dialogue ниже) — снимается только через resumes_dialogue_at/
# triggers_scripted_dialogue нужного этапа, обычно самого первого узла
# персонажа (см. пример ниже) — иначе 'operator'; оператор может
# переключить режим вручную в любой момент.
#
# Этапы (stages):
#   slug              — уникальный человекочитаемый id этапа (не менять после публикации,
#                        на нём завязаны ссылки requires у других этапов)
#   title, description — текст, который видит команда
#   chapter           — необязательно, название главы ("Глава 3. К.Р.").
#                        Команде над списком задач показывается название
#                        главы САМОГО НЕДАВНО ОТКРЫВШЕГОСЯ у неё этапа (не
#                        последнего выполненного) — так что имеет смысл
#                        указывать chapter хотя бы на первом этапе каждой
#                        главы (остальным этапам той же главы можно не
#                        повторять, но если укажете — тоже ничего не сломает).
#   completion_type   — actor | answer | checkbox | manual_review | dialogue
#                        (dialogue — завершается автоматически концом "куска"
#                        сценарного диалога, см. completes_stage узла ниже;
#                        вручную не отмечается, ни у команды, ни у актёра/
#                        оператора кнопки для него нет)
#   requires          — список slug этапов-предпосылок (граф — только AND:
#                        этап открывается, когда пройдены ВСЕ перечисленные)
#   triggers_scripted_dialogue — необязательно, список slug персонажей: когда
#                        команда проходит этот этап (любым способом), чат с
#                        каждым из них сам переключается в режим "сценарий" И
#                        становится видимым в списке чатов команды (не нужно
#                        ни искать ник, ни оператору вручную включать режим).
#                        Оператор всё ещё может вручную переключить режим
#                        обратно через dropdown в админке при необходимости.
#                        Используйте для ПЕРВОГО появления персонажа в кадре.
#   resumes_dialogue_at — необязательно, {slug_персонажа: key_узла}: когда
#                        команда проходит этот этап, диалог с персонажем
#                        молча передвигается на указанный узел — БЕЗ смены
#                        режима чата (в отличие от triggers_scripted_dialogue
#                        выше). Команда увидит новый "кусок" разговора только
#                        когда оператор САМ вручную включит режим "сценарий"
#                        через dropdown — это осознанно оставлено ручным
#                        действием. Нужно для персонажей, с которыми диалог
#                        идёт кусками через весь квест (см. пример ниже).
#   fields            — только для completion_type: answer. order_sensitive: true
#                        означает, что accepted относится именно к этому полю;
#                        чтобы сделать order-insensitive группу полей, укажите
#                        ОДИН И ТОТ ЖЕ список accepted у каждого поля группы
#                        и order_sensitive: false. Сравнение всегда без учёта
#                        регистра и лишних пробелов.
#                        accepted          — точные принятые ответы (как раньше)
#                        accepted_contains — необязательно: "ключевые слова",
#                          засчитывается, если хотя бы одно встречается ПОДСТРОКОЙ
#                          в ответе команды. Пример: accepted_contains: ["кружк", "чашк"]
#                          примет и "кружка", и "чашка - улика", и "дело в кружке".
#                          Можно использовать accepted и accepted_contains вместе.
#
# Скриптованный диалог персонажа (необязательный ключ dialogue у персонажа):
#   nodes            — список узлов
#     key            — локальный id узла внутри этого персонажа
#     entry: true     — ровно один такой узел, с него начинается диалог
#                        (с него же начинают ВСЕ команды при регистрации —
#                        остальные узлы становятся видны только через
#                        triggers_scripted_dialogue/resumes_dialogue_at
#                        этапов или естественным ходом диалога)
#     intro          — что персонаж "говорит" при попадании в этот узел
#     requires_all_options — узел не отпускает команду, пока не выбраны
#                        ВСЕ варианты по одному (выбор не влияет на сюжет,
#                        нужно просто перебрать все); next в этом случае —
#                        куда идти, когда варианты закончились
#     final_reply    — только при requires_all_options: реплика персонажа
#                        на ПОСЛЕДНИЙ (закрывающий набор) выбор команды не
#                        привязана к конкретному варианту — её получает тот
#                        вариант, который команда выбрала последней, какой бы
#                        он ни был. Если не задано — как раньше, используется
#                        обычный reply того варианта.
#     is_block_post  — "блок-пост": команда, попав в этот узел, видит
#                        "печатает..." БЕЗ кнопок выбора — реплику персонажа
#                        в этот момент решает оператор в разделе "Блок-посты":
#                        либо выбирает один из options этого узла (это уже не
#                        кнопки команды, а варианты реплики НА ВЫБОР ОПЕРАТОРУ),
#                        либо пишет свой текст. next у такого узла обязателен
#                        (куда идти после ответа оператора) — ветвления по
#                        выбору оператора нет, он выбирает только текст.
#     completes_stage — необязательно, slug этапа: когда диалог доходит ИМЕННО
#                        до этого узла и дальше не идёт (у узла/выбранного
#                        варианта нет next — "кусок" разговора закончился),
#                        указанный этап сам отмечается выполненным для
#                        команды. У такого этапа completion_type обязательно
#                        должен быть 'dialogue' (см. выше) — и наоборот, у
#                        любого этапа с completion_type: dialogue должен быть
#                        ровно один узел (любого персонажа), который на него
#                        так ссылается. Одновременно с этим чат персонажа
#                        уходит в 'тихий' режим (muted) — обычное поведение
#                        конца "куска" диалога, см. options ниже.
#     options        — 1-4 варианта:
#       - на обычном узле: кнопки команды. key, text, reply — id, текст
#         кнопки, ответ персонажа на этот выбор; next — key следующего узла
#         (не указан = "кусок" диалога кончается, чат уходит в muted)
#         sent — необязательно: если короткая подпись на кнопке (text) не
#         совпадает с тем, что нужно "отправить" в чат от лица команды
#         (например, кнопка "Собрание", а в чат должно уйти "Сегодня у секты
#         будет собрание в парке Сокольники.") — укажите здесь полный текст;
#         если не указан, в чат уходит text как раньше.
#       - на is_block_post узле: кандидаты реплики для оператора. key, text —
#         короткая внутренняя пометка (видна только оператору), reply — сам
#         текст, который оператор может отправить одним нажатием; next, key
#         кнопки команде и sent здесь не участвуют
#
# Пример персонажа, с которым диалог идёт "кусками" через весь квест —
# кусок 1 находится и запускается командой через поиск ника, кусок 2
# подключается тихо (resumes_dialogue_at) при выполнении отдельного этапа
# и ждёт, пока оператор вручную включит 'сценарий':
#
#   characters:
#     - slug: curator
#       nickname: "curator_2026"
#       dialogue:
#         nodes:
#           - key: chunk1_start
#             entry: true
#             completes_stage: talk_to_curator_1   # сработает, когда
#             options:                             # диалог остановится
#               - key: only                        # на ЭТОМ узле (у only
#                 text: "Здравствуйте!"             # нет next)
#                 reply: "Добрый день."
#           - key: chunk2_start
#             completes_stage: talk_to_curator_2
#             intro: "Ну как, что-то узнали?"
#             options:
#               - key: only
#                 text: "Да, вот что мы нашли..."
#                 reply: "Отлично, уже что-то."
#                 # next не указан -> конец куска 2
#   stages:
#     - slug: talk_to_curator_1
#       completion_type: dialogue   # completes_stage у варианта chunk1_start.only
#     - slug: some_earlier_task
#       # ...
#     - slug: talk_to_curator_2
#       completion_type: dialogue   # completes_stage у варианта chunk2_start.only
#       requires: [some_earlier_task]
#       resumes_dialogue_at: {curator: chunk2_start}
#
# Это боевой контент квеста — заполняется по-настоящему, для реального
# события.
#
# Запуск загрузки:
#   cd backend && python import_content.py
# (по умолчанию читает ../data/quest_content.yaml)

characters:
  - slug: curator
    name: "Куратор"
    nickname: "mark1979"
    dialogue:
      nodes:
        # --- Глава 1: первый контакт, кусок 1 ---
        - key: ch1_greet
          entry: true
          options:
            - key: hello
              text: "Здравствуйте! Мы по поводу Вашего поста в r/LostRubiks"
              reply: "О, добрый день! Рад, что кто-то откликнулся. У вас тоже украли кубик Рубика?"
              next: ch1_confirm_theft
        - key: ch1_confirm_theft
          options:
            - key: "yes"
              text: "Да"
              reply: "Понятно…\nИ что же, вы серьезно настроены?"
              next: ch1_serious
        - key: ch1_serious
          options:
            - key: "yes"
              text: "Да"
              reply: "Хорошо. Тогда передам вам всё, что мне удалось найти по этому делу на данный момент. Где вы сейчас находитесь?"
              next: ch1_location
            - key: "no"
              text: "Нет"
              reply: "И что же вы тогда мне пишете?)"
              next: ch1_serious
        - key: ch1_location
          completes_stage: ch1_contact_curator
          options:
            - key: here
              text: "Воробьёвы горы"
              reply: "Отлично. Подождите немного…"
              # next не указан -> кусок 1 закончен, ch1_contact_curator готов

        # --- Глава 2→3: кусок 2, подключается тихо через ch2_track_address
        # (resumes_dialogue_at), ждёт, пока оператор включит "сценарий" ---
        - key: ch2_curator_intro
          intro: "Ну как, что-то узнали?"
          options:
            - key: found_address
              text: "Похититель живет по адресу: улица Покровка, дом 20/1с1."
              reply: "Это хорошая зацепка! А про значок его выяснили что-нибудь?"
              next: ch2_curator_plan
        - key: ch2_curator_plan
          completes_stage: ch2_talk_to_curator
          options:
            - key: no_luck
              text: "Пока что нет."
              reply: "Ну ладно. Я искал, что он значит, всеми возможными способами, но ничего не нашел…\nЗнаете, у меня есть план. Думаю, содержимое его рюкзака может помочь нам в расследовании. Курьер передаст вам абсолютно идентичный рюкзак, а вы подкараульте, когда он будет выходить из дома, незаметно проследите, чем он занимается, а потом подмените его рюкзак. Посмотрим, что скрывает наш вор кубиков!\nС Курьером встретьтесь здесь: 55.758680, 37.647862"
              # next не указан -> кусок 2 закончен, ch2_talk_to_curator готов

        # --- Глава 4→5: кусок 3, подключается тихо через ch4_archive_data
        # (resumes_dialogue_at). Узел с requires_all_options — команда должна
        # перебрать все 5 вариантов (в любом порядке), у каждого своя
        # короткая подпись на кнопке (text) и полное сообщение в чат (sent) ---
        - key: ch4_curator_intro
          intro: "Ну как вы там?"
          options:
            - key: sect
              text: "Этого человека зовут Кристофер, и он - часть секты!"
              reply: "СЕКТЫ??? Это становится чересчур странно… А что за секта?"
              next: ch4_curator_sect_menu
        - key: ch4_curator_sect_menu
          requires_all_options: true
          completes_stage: ch4_talk_to_curator
          # Особый ответ достаётся не "Интернету" конкретно, а тому варианту,
          # который команда выберет ПОСЛЕДНИМ (см. final_reply ниже) — какой
          # именно это будет вариант, заранее не известно.
          final_reply: "Понятно.\nНадо обязательно воспользоваться возможностью и внедриться на их собрание! Давайте поступим так. Я сделаю вам такую же мантию, как у них, но установлю на нее камеру. Курьер передаст ее, кто-то из вас проберется на собрание - и мы узнаем, к чему им наши кубики Рубика, и что они задумали!"
          options:
            - key: meeting
              text: "Собрание"
              sent: "Сегодня у секты будет собрание в парке Сокольники."
              reply: "Интересно… что-то еще?"
            - key: rituals
              text: "Обряды"
              sent: "У них есть собрания, на которые они все ходят в мантиях и скрывают свое лицо даже друг от друга!"
              reply: "Интересно… что-то еще?"
            - key: alphabet
              text: "Алфавит"
              sent: "Мы расшифровали их секретный алфавит."
              reply: "Интересно… что-то еще?"
            - key: icann
              text: "ICANN"
              sent: "Эта секта ищет бункер ICANN."
              reply: "Интересно… что-то еще?"
            - key: internet
              text: "Интернет"
              sent: "Сектанты ненавидят интернет и считают, что без него мир будет лучше."
              reply: "Интересно… что-то еще?"
              # next не указан на узле -> кусок 3 закончен, ch4_talk_to_curator готов

        # --- Глава 6→7: кусок 4, подключается тихо через ch6_find_icann_bunker
        # (resumes_dialogue_at), ждёт, пока оператор включит "сценарий" ---
        - key: ch6_curator_intro
          intro: "Как идет ваше расследование? Нашли бункер?"
          completes_stage: ch6_talk_to_curator
          options:
            - key: found
              text: "Да, он тут: 55.840189, 37.622297."
              reply: "ВДНХ? Неожиданно…\nСлушайте, я хотел попросить вас об одной вещи. Как вы знаете, Курьер отправился следить за главарем секты. Проблема в том, что начиная с какого-то момента он перестал выходить на связь… видимо, там, где прервался сигнал, стоят какие-то глушилки секты…\nНадо его найти. Во-первых, без него я не знаю, как связаться с ICANN, во-вторых нужно понять, что задумал их главарь, ну а в-третьих хороший он человек, нельзя бросать его в беде… Найдите его, пожалуйста! Связь прервалась здесь: 55.742343, 37.613394."
              # next не указан -> кусок 4 закончен, ch6_talk_to_curator готов

        # --- Глава 7→8: кусок 5 (последний), подключается тихо через
        # ch7_escape_unnoticed (resumes_dialogue_at). Здесь команда говорит
        # первой (intro не нужен) — Куратор реагирует на найденное тело ---
        - key: ch7_curator_grief_start
          options:
            - key: died
              text: "Он погиб…"
              reply: "…\n\nНет слов…"
              next: ch7_curator_grief_menu
        - key: ch7_curator_grief_menu
          completes_stage: ch7_talk_to_curator
          options:
            - key: condolences
              text: "Соболезнования"
              sent: "Мы приносим наши соболезнования…"
              reply: "Это так ужасно… Господи, как это ужасно…\nПрошу вас, доведите дело до конца. Нельзя, чтобы вышло, что он умер напрасно… Спасите интернет!"
            - key: inspiration
              text: "Воодушевление"
              sent: "Он погиб, но он выполнил своё задание. Он герой!"
              reply: "Это так ужасно… Господи, как это ужасно…\nПрошу вас, доведите дело до конца. Нельзя, чтобы вышло, что он умер напрасно… Спасите интернет!"
            - key: icann
              text: "ICANN"
              sent: "Оказывается, он был агентом ICANN… теперь понятно, почему ему была так важна эта миссия…"
              reply: "Это так ужасно… Господи, как это ужасно…\nПрошу вас, доведите дело до конца. Нельзя, чтобы вышло, что он умер напрасно… Спасите интернет!"
              # next не указан на любом варианте -> кусок 5 закончен, ch7_talk_to_curator готов

  - slug: pavel_ksi
    name: "Павел Кси"
    nickname: "pavel_ksi"
    dialogue:
      nodes:
        - key: pavel_greet
          entry: true
          options:
            - key: hello
              text: "Добрый день, Павел! Мы по поводу похищения кубика Рубика из Вашего офиса."
              reply: "Здравствуйте! Вы что-то выяснили? Буду рад помочь."
              next: pavel_taxi_lead
        - key: pavel_taxi_lead
          completes_stage: ch2_contact_informant
          options:
            - key: taxi
              text: "Во время одного из похищений неизвестный уехал на такси Вашей компании. Может, Вы сможете что-то разузнать о пассажире?"
              reply: "Интересно… давайте встретимся, я дам вам доступ к базе данных всех поездок. Может, сможете найти что-то полезное…\nБуду ждать вас тут: https://yandex.ru/maps/-/CTS15Hn-"
              # next не указан -> диалог закончен, ch2_contact_informant готов

stages:
  - slug: ch1_watch_cameras
    title: "Посмотрите записи с камер видеонаблюдения"
    description: "Что необычного вы заметили?"
    completion_type: answer
    chapter: "Глава 1. Начало"
    fields:
      - key: answer
        label: "Ответ"
        order: 1
        order_sensitive: true
        accepted_contains: ["кубик", "Рубик"]

  - slug: ch1_investigate_theft
    title: "Разберитесь с похищением"
    description: "Получите зацепку: где стоит продолжить расследование?"
    completion_type: answer
    requires: [ch1_watch_cameras]
    resumes_dialogue_at: {curator: ch1_greet}
    fields:
      - key: answer
        label: "Ответ"
        order: 1
        order_sensitive: true
        accepted_contains: ["реддит", "reddit", "LostRubiks"]

  - slug: ch1_contact_curator
    title: "Свяжитесь с создателем реддит-сообщества"
    completion_type: dialogue
    requires: [ch1_investigate_theft]

  - slug: ch1_get_photos
    title: "Получите фотографии"
    completion_type: checkbox
    requires: [ch1_contact_curator]

  - slug: ch1_find_clue
    title: "Найдите зацепку на фотографиях"
    completion_type: answer
    requires: [ch1_get_photos]
    resumes_dialogue_at: {pavel_ksi: pavel_greet}
    fields:
      - key: answer
        label: "Ответ"
        order: 1
        order_sensitive: true
        accepted_contains: ["кси", "такси", "а591ре"]

  - slug: ch2_contact_informant
    title: "Свяжитесь с полезным информатором"
    description: "Он может помочь вам узнать чуть больше о таинственном похитителе"
