# Игровой контент: персонажи + граф этапов + поля ответа.
#
# Персонажи (characters):
#   slug        — уникальный id (не менять после публикации)
#   name        — как зовут персонажа "по паспорту"
#   nickname    — ник, по которому команда ищет его в контактах чата
#   public_lore — необязательно, публичная предыстория персонажа
# При регистрации команды под каждого персонажа автоматически создаётся
# чат (плюс один чат техподдержки) — см. backend/chat.py: seed_team_chats.
#
# Этапы (stages):
#   slug              — уникальный человекочитаемый id этапа (не менять после публикации,
#                        на нём завязаны ссылки requires у других этапов)
#   title, description — текст, который видит команда
#   completion_type   — actor | answer | checkbox | manual_review
#   requires          — список slug этапов-предпосылок (граф — только AND:
#                        этап открывается, когда пройдены ВСЕ перечисленные)
#   fields            — только для completion_type: answer. order_sensitive: true
#                        означает, что accepted относится именно к этому полю;
#                        чтобы сделать order-insensitive группу полей, укажите
#                        ОДИН И ТОТ ЖЕ список accepted у каждого поля группы
#                        и order_sensitive: false
#
# Этот файл — пример/заготовка. Запуск загрузки:
#   cd backend && python import_content.py
# (по умолчанию читает ../data/quest_content.yaml)

characters:
  - slug: curator
    name: "Куратор"
    nickname: "curator_2026"
    public_lore: "Таинственный куратор квеста."

stages:
  - slug: intro
    title: "Знакомство"
    description: "Первое задание квеста."
    completion_type: actor

  - slug: find_place_and_time
    title: "Найдите место и время"
    description: "Разгадайте, где и когда это произошло."
    completion_type: answer
    requires: [intro]
    fields:
      - key: place
        label: "Место"
        hint: "где это было"
        order: 1
        order_sensitive: true
        accepted: ["дом"]
      - key: time
        label: "Время"
        hint: "во сколько"
        order: 2
        order_sensitive: true
        accepted: ["полночь"]

  - slug: confirm_ready
    title: "Готовы продолжить?"
    description: "Нажмите, когда будете готовы идти дальше."
    completion_type: checkbox
    requires: [find_place_and_time]

  - slug: send_evidence_photo
    title: "Пришлите фото доказательства"
    description: "Сфотографируйте то, что нашли, и отправьте на проверку."
    completion_type: manual_review
    requires: [confirm_ready]

# Телефонные номера (phone_numbers):
#   number         — строка цифр, как её наберёт команда
#   character_slug — необязательно, привязка номера к персонажу
#   phases         — фазы звонка:
#     key               — локальный id фазы внутри этого номера
#     entry: true        — ровно одна такая фаза на номер, с неё начинается звонок
#     audio             — путь/id аудио, которое проигрывается на этой фазе
#     requires_password — есть ли на этой фазе ввод пароля
#     password          — правильный пароль (только если requires_password)
#     on_success/on_failure — key следующей фазы после верного/неверного пароля;
#                              не указан = звонок сбрасывается после этой фазы
phone_numbers:
  - number: "89998887766"
    character_slug: curator
    phases:
      - key: entry
        entry: true
        audio: "calls/curator_intro.mp3"
        requires_password: true
        password: "полночь"
        on_success: success
        on_failure: failure
      - key: success
        audio: "calls/curator_success.mp3"
      - key: failure
        audio: "calls/curator_failure.mp3"
